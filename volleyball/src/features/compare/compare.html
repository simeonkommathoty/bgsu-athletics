<div class="content page active" id="page-compare">
    <div style="font-family:var(--fh);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;">Athlete Comparison</div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:12px;align-items:flex-end;margin-bottom:20px;">
      <div><div class="form-lbl" style="margin-bottom:5px;">ATHLETE A</div><select id="cmp-a" data-onchange="renderCompare()" style="width:100%;"></select></div>
      <div style="font-family:var(--fh);font-size:20px;font-weight:900;color:var(--text3);padding-bottom:7px;text-align:center;">VS</div>
      <div><div class="form-lbl" style="margin-bottom:5px;">ATHLETE B</div><select id="cmp-b" data-onchange="renderCompare()" style="width:100%;"></select></div>
      <div><div class="form-lbl" style="margin-bottom:5px;">ATHLETE C (OPT.)</div><select id="cmp-c" data-onchange="renderCompare()" style="width:100%;"><option value="">— none —</option></select></div>
    </div>
    <div class="grid2 mb4">
      <div class="card">
        <div class="ctitle" style="margin-bottom:12px;"><div class="cdot"></div>Radar Comparison</div>
        <div class="cw" style="height:280px;"><canvas id="cmp-radar" role="img" aria-label="Radar chart comparing athletes">Athlete comparison radar.</canvas></div>
        <div id="cmp-radar-legend"></div>
      </div>
      <div class="card">
        <div class="ctitle" style="margin-bottom:12px;"><div class="cdot"></div>Athlete Cards</div>
        <div id="cmp-cards" style="display:flex;gap:11px;flex-wrap:wrap;"></div>
      </div>
    </div>
    <div class="card">
      <div class="ctitle" style="margin-bottom:14px;"><div class="cdot"></div>Metric-by-Metric</div>
      <div id="cmp-bars"></div>
    </div>
  </div>
